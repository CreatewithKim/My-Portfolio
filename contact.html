<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <!-- Load font used by the site -->
    <link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Main stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="contact-section">
        <div class="contact-container">
            <div class="contact-left">
                <h1>Get in <span>Touch</span></h1>
                <p>If you have a project, question, or just want to say hi, drop a message and I'll get back to you!</p>
            </div>
            <div class="contact-right">
                <h2>Contact Me</h2>
                <form class="contact-form">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>

                    <label for="message">Message:</label>
                    <textarea id="message" name="message" required></textarea>

                    <button class="main-btn" type="submit">Send</button>
                </form>
                <div class="divider"><span>Or reach me on</span></div>

                <a
                    href='https://wa.me/254769811851?text=Hi%2C%20I%20came%20across%20your%20portfolio%20and%20would%20like%20to%20get%20in%20touch.'
                    class="social-btn whatsapp-btn"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <i class="fab fa-whatsapp"></i>
                    WhatsApp
                </a>

                <a
                    href="https://instagram.com/YOUR_USERNAME"
                    class="social-btn instagram-btn"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <i class="fab fa-instagram"></i>
                    Instagram
                </a>
            </div>
        </div>
    </section>
</body>
</html>
